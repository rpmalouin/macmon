[package]
name = "macmon-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI over the macmon sampler, for UIs that are not Rust"
license = "MIT"
publish = false

[lib]
name = "macmon_ffi"
crate-type = ["rlib", "staticlib"]

[dependencies]
macmon = { path = "..", default-features = false, features = ["procs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
